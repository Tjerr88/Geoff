wing", 5, "rep"], ["Front Squat", 5, "rep"], ["Swing", 5, "rep"], ["Press", 5, "rep"], ["Swing", 5, "rep"]], [["Swing", 5, "rep"], ["Clean", 5, "rep"], ["Swing", 5, "rep"], ["Snatch", 5, "rep"], ["Swing", 5, "rep"], ["High Pull", 5, "rep"], ["Swing", 5, "rep"]]], "weeks": [[3, 1.5], [4, 1.5], [5, 1.5], [3, 1.0], [4, 1.0], [5, 1.0]], "rm": ""}, "mkm19": {"title": "Jerk Werk", "days": [[["Clean", 0, "rep"], ["Jerk", 0, "rep"], ["Front Squat", 0, "rep"], ["Jerk", 0, "rep"]], [["Clean", 0, "rep"], ["Jerk", 0, "rep"], ["Snatch", 0, "rep"], ["Jerk", 0, "rep"], ["Front Squat", 0, "rep"]], [["Clean", 0, "rep"], ["Jerk", 0, "rep"], ["Snatch", 0, "rep"], ["Jerk", 0, "rep"], ["Front Squat", 0, "rep"], ["Jerk", 0, "rep"]]], "weeks": [[8, 2], [8, 1.5], [8, 1], [10, 2], [10, 1.5], [10, 1]], "rm": "Double Snatch 10RM"}, "mkm20": {"title": "Herky Jerky", "days": [[["Front Squat", 6, "rep"], ["Jerk", 6, "rep"], ["Clean", 6, "rep"], ["Jerk", 6, "rep"]], [["Jerk", 6, "rep"], ["Clean", 6, "rep"], ["Jerk", 6, "rep"]], [["Clean", 6, "rep"], ["Jerk", 6, "rep"], ["Front Squat", 6, "rep"], ["Snatch", 6, "rep"], ["Jerk", 6, "rep"]]], "weeks": [[3, 2.0], [4, 2.0], [5, 2.0], [3, 1.5], [4, 1.5], [5, 1.5], [3, 1.0], [4, 1.0], [5, 1.0]], "rm": "Jerk 12RM"}};

function plan(p,w,d,minutes,includeDfs) {
  const i=d-1, j=w-1;
  const base={exercise:'Clean & Press',rm:'10RM',seconds:minutes*60,rest:0,reps:[1],limit:0,dfs:0,guidance:'Rest as needed.'};
  if(mkm[p]){
    const entry=mkm[p];
    const [limit,ratio]=entry.weeks[j];
    return {...base,mkm:true,rm:entry.rm||'Weight per kettlebell',seconds:0,limit,ratio,
      ladder:p==='mkm19'?(w<=3?4:5):0,items:entry.days[i],guidance:p==='mkm9'&&d===2?'Take a rest day before Day 3.':''};
  }
  if(muscle[p]){
    const phase2=p==='km2', warmup=p==='km0';
    const sets=[4,5,6,5,6,7][j];
    const limit=warmup?(d===3?[1,2,2,3,3,0]:[1,2,3,3,4,0])[j]:phase2&&d===3?[3,4,5,3,4,5][j]:sets-(d===3||phase2&&d===1?1:0);
    const rest=warmup?120:phase2&&d===2?(w<=3?90:75):phase2&&d===3?(w<=3?150:120):(w<=3?120:90);
    return {...base,rm:'Weight per kettlebell',seconds:0,reps:[5],
      limit,rest,off:limit===0,complex:(phase2?musclePhase2:[medium,easyDay,heavy])[i]};
  }
  if(giant[p]) return {...base,reps:giant[p][i],rm:p==='g3'?'5RM':'10RM'};
  if(p==='easy') return {...base,reps:[(w<=4?[5,6,4]:[6,7,5])[i]],guidance:'RPE '+[7,8,'8.5',9][j%4]+' · Stop if speed or technique changes.'};
  if(p==='simple') {
    const s={...base,rm:'5RM',pair:true,seconds:1800,guidance:'Rest between exercises. If you slow down, rest longer.'};
    if(w<5) return {...s,reps:simple[j][i],choice:w===4 && d!==2};
    return {...s,seconds:0,reps:[3],limit:6,test:d===2,pair:d===1};
  }
  if(single[p]) {
    const advanced=p.endsWith('2');
    return {...base,exercise:p.startsWith('ksk')?'Snatch':'Clean & Jerk',seconds:1200,
      reps:single[p][Math.floor(j/3)][i],perHand:true,
      rm:advanced?'Min. 25 reps per hand':'7–8RM per hand',
      guidance:advanced?'Rest between sets. Switch hands without resting if possible.':'Rest as needed.'};
  }
  const entry=strong[p][j].split(' ')[i];
  const [limit,reps]=entry.split('x').map(Number);
  const rest=p==='s2'?120:p==='s3'?120-10*(j+i):0;
  return {...base,rm:'C&P weight',seconds:0,test:entry==='RM',limit,reps:[reps],rest,dfs:includeDfs?squats[p][j][i]:0,guidance:''};
}

  $(id).replaceChildren(...Array.from({length:size},(_,i)=>new Option(i+1,i+1)));

}

  $('program').value=p;
  options('week',weeks[p],prefs.week);
  options('day',dayCount(p,prefs.week),prefs.day);
  $('duration').value=prefs.duration;
  $('durationLabel').hidden=!(giant[p]||p==='easy');
  $('dfsLabel').hidden=!strong[p];
  $('dfs').checked=prefs.dfs;
  $('weightLabel').textContent=current().rm+' (kg)';
  $('weight').value=prefs.weights[weightKey(p)]??'';
}
function movement(p) {
  const step=p.pair?Math.floor(run.sets/2):run.sets;
  const dfs=p.dfs && run.sets>=(p.test?1:p.limit);
  let sequence=p.reps;
  if(p.choice && !run.extra) sequence=prefs.day===1?p.reps.slice(0,4):[3];
  return {exercise:dfs?'Double Front Squat':p.pair && run.sets%2?'Front Squat':p.exercise,
    reps:dfs?p.dfs:sequence[step%sequence.length],dfs};
}
function following() {
  const {program:p,week:w,day:d}=prefs;
  if(p==='km0' && w===5 && d===3) return ['km0',6,1];
  if(p==='km0' && w===6) return ['km1',1,1];
  if(d<dayCount(p,w)) return [p,w,d+1];
  if(w<weeks[p]) return [p,w+1,1];
  if(transitions[p]) return [transitions[p],1,1];
  return null;
}
function secondsLeft(until) {return Math.max(0,Math.ceil((until-Date.now())/1000));}
function timeLabel(seconds) {return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');}
function complete() {
  run.status='complete';
  const next=following();
  prefs.last={program:prefs.program,week:prefs.week,day:prefs.day,sets:run.sets,reps:run.total,test:run.test,next};
  if(next) [prefs.program,prefs.week,prefs.day]=next;
  save();
}
function moreMuscleRound(p, now) {
  const reps=p.ladder?run.sets%p.ladder+1:0;
  const timed=p.items[0][2]==='sec';
  const elapsed=run.workStart==null?0:(now-run.workStart)/1000;
  const index=timed?Math.floor(elapsed/p.items[0][1]):-1;
  return {timed,index,elapsed,items:p.items.map(([name,count,unit])=>{
    const amount=reps||count;
    return {label:amount+' '+(unit==='rep'?'×':unit==='sec'?'sec ·':'per leg ·')+' '+name,amount,unit};
  })};
}
function show() {
  const result=run.status==='complete'?prefs.last:null;
  const p=result?plan(result.program,result.week,result.day,prefs.duration,prefs.dfs):current();
  const m=movement(p);
  const active=run.status==='active';
  const rest=secondsLeft(run.restUntil);
  const left=run.deadline?secondsLeft(run.deadline):p.seconds;
  if(active && run.deadline && left===0){if(run.sets){complete();show();}else ready(false);return;}
  const test=p.test && run.sets===0;
  $('start').textContent=p.off?'Go to Phase 1':'Start';
  $('done').textContent=p.complex?'Round complete':'Set complete';
  const cap=p.test?1:p.limit;
  const weight=prefs.weights[weightKey(prefs.program)];
  const round=p.mkm&&!result?moreMuscleRound(p,Date.now()):null;
  const working=!!round&&run.workStart!=null;
  const currentItem=working&&round.timed?round.items[round.index]:null;
  const list=$('complex');
  list.hidden=!!result||!(p.complex||round)||p.off;
  const exercises=list.hidden?[]:round?round.items.map(item=>item.label):p.complex;
  if(list.dataset.exercises!==exercises.join('|')){
    list.dataset.exercises=exercises.join('|');
    list.replaceChildren(...exercises.map(name=>{
      const li=document.createElement('li');
      li.textContent=name;
      return li;
    }));
  }
  const phase=single[prefs.program]?' · Phase '+Math.ceil(prefs.week/3):'';
  $('session').textContent=result?names[result.program]+' · Week '+result.week+' · Day '+result.day:
    names[prefs.program]+phase+' · Week '+prefs.week+' · '+(p.complex?['Monday','Wednesday','Friday'][prefs.day-1]:'Day '+prefs.day);
  $('instruction').textContent=result?'Workout complete':rest?'Rest':test?'Test your '+(prefs.program==='simple'?'Press RM':'Clean & Press Rep Max'):
    p.off?'Rest week':p.complex?'Do '+m.reps+' reps per exercise':'Do '+m.reps+' × '+m.exercise+(p.perHand?' per hand':'');
  if(round){
    $('instruction').textContent=rest?'Rest':currentItem?currentItem.label:
      working&&round.timed?'Set complete':working?'Do the exercises in order':'Set '+(run.sets+1)+' of '+p.limit;
  }
  const prescription=[];
  if(!result && !p.off){
    if(!m.dfs) prescription.push((weight?weight+' kg · ':'')+p.rm);
    if(m.dfs) prescription.push('3 sets of '+m.reps);
    else if(p.limit && !round) prescription.push(p.pair?'3 × 3 per exercise':p.limit+' sets of '+p.reps[0]);
    else if(p.reps.length>1) prescription.push(p.reps.join(' → ')+(p.choice?' · last rung optional':''));
  }
  $('prescription').textContent=prescription.join(' · ');
  $('guidance').textContent=result?'':test && prefs.program==='simple'?'Use the same weight or go heavier.':m.dfs?'Rest as needed.':p.off?'':p.rest?p.rest+(p.complex?' sec rest between rounds.':' sec rest between C&P sets.'):p.guidance;
  if(round && p.ratio) $('guidance').textContent='Work : rest 1:'+String(p.ratio)+(p.guidance?' · '+p.guidance:'');
  $('clock').hidden=!!result||!(rest||p.seconds||working);
  $('clock').textContent=timeLabel(rest||(currentItem?currentItem.amount-Math.floor(round.elapsed)%currentItem.amount:working?Math.floor(round.elapsed):left));
  const count=m.dfs?run.sets-cap:run.sets;
  $('progress').textContent=result?result.sets+' sets · '+result.reps+' reps'+(result.test?' · RM '+result.test+' reps':''):
    active && !test ? count+(m.dfs?' / 3':p.limit?' / '+p.limit:'')+' sets · '+run.total+' reps':'';
  if(round || (result && p.mkm)) $('progress').textContent=(result?.sets??run.sets)+' / '+p.limit+' sets';
  $('testLabel').hidden=!(active&&test);
  $('config').querySelectorAll('input,select').forEach(el=>el.disabled=active);
  $('settings').hidden=!!result;
  $('start').hidden=run.status!=='ready'||!!round;
  $('done').hidden=!(active||round);
  $('done').disabled=!!rest;
  $('done').textContent=test?'Save RM':p.complex?'Round complete':'Set complete';
  if(round) $('done').textContent=rest?'Rest':working?'Set complete':'Start set';
  $('variant').hidden=!(active&&p.choice);
  $('variant').textContent=prefs.day===1?(run.extra?'Skip the 5-rep rung':'Add the 5-rep rung'):(run.extra?'Sets of 3 only':'Alternate 3 and 4');
  $('finish').hidden=!(active&&p.seconds);
  $('reset').hidden=run.status==='ready';
  $('reset').textContent=result?'Settings':'Cancel';
  $('next').hidden=!result?.next;
  if(result?.next) $('next').textContent=result.next[0]!==result.program?'Go to '+names[result.next[0]]:'Next workout';
}
$('config').addEventListener('submit',e=>e.preventDefault());
$('config').addEventListener('change',e=>{
  if(run.status!=='ready')return;
  const id=e.target.id;
  if(id==='program'){prefs.program=e.target.value;prefs.week=1;prefs.day=1;}
  if(id==='week'){prefs.week=Number(e.target.value);prefs.day=Math.min(prefs.day,dayCount(prefs.program,prefs.week));}
  if(id==='day'||id==='duration')prefs[id]=Number(e.target.value);
  if(id==='dfs')prefs.dfs=e.target.checked;
  if(id==='weight' && e.target.checkValidity())prefs.weights[weightKey(prefs.program)]=e.target.valueAsNumber||null;
  save();syncSettings();show();
});
$('start').onclick=()=>{
  const p=current();
  if(p.off){complete();show();return;}
  run={...fresh(),status:'active',deadline:p.seconds?Date.now()+p.seconds*1000:0};
  $('settings').open=false;
  $('testReps').value='';
  show();
};
$('done').onclick=()=>{
  if(run.status==='complete'||secondsLeft(run.restUntil))return;
  const selected=current();
  if(selected.mkm){
    const now=Date.now();
    if(run.workStart==null){
      run.status='active';
      run.workStart=now;
      $('settings').open=false;
    } else {
      const elapsed=now-run.workStart;
      run.workStart=null;
      run.sets++;
      if(run.sets===selected.limit) complete();
      else run.restUntil=now+Math.ceil(elapsed*selected.ratio/1000)*1000;
    }
    show();
    return;
  }
  if(run.status!=='active')return;
  if(run.deadline && !secondsLeft(run.deadline)){show();return;}
  const p=current(), m=movement(p), testing=p.test && run.sets===0;
  if(testing){
    if(!$('testReps').value||!$('testReps').reportValidity()){$('testReps').focus();return;}
    run.test=$('testReps').valueAsNumber;
  }
  run.sets++;
  run.total+=testing?run.test:m.reps*(p.complex?.length??(p.perHand?2:1));
  const max=p.test?1:p.limit;
  if(max && run.sets>=max+(p.dfs?3:0))complete();
  else if(p.rest && !testing && run.sets<max)run.restUntil=Date.now()+p.rest*1000;
  show();
};
$('variant').onclick=()=>{run.extra=!run.extra;show();};
$('finish').onclick=()=>{if(run.sets){complete();show();}else $('reset').click();};
function ready(openSettings) {
  run=fresh();
  syncSettings();
  $('settings').open=openSettings;
  show();
}
$('reset').onclick=()=>{if(run.status==='active' && !confirm('Cancel workout?'))return;ready(true);};
$('next').onclick=()=>ready(prefs.last?.program==='g3' && prefs.program==='g10' && !prefs.weights.giant10);
syncSettings();show();
setInterval(()=>{if(run.status==='active')show();},250);
</script>
</html>
